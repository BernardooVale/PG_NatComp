dataset: synth1
pop_size: 50
generations: 100
max_size: 7
size_mode: depth
init_method: ramped_half_and_half
init_min_depth: 1
selection: tournament
tournament_size: 2
lexicase_epsilon: mad
crossover_prob: 0.9
mutation_prob: 0.05
mutation_type: subtree
elitism: true
elite_size: 1
function_set:
- add
- sub
- mul
- div
const_range:
- -1.0
- 1.0
const_prob: 0.3
normalize_concrete: false
seed: 0
n_runs: 30
n_jobs: -1
